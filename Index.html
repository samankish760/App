<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دفتر — مدیریت مالی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAF1E4;
    --paper-2:#DEE8D5;
    --line:#C3D0B8;
    --ink:#20301F;
    --ink-soft:#54604E;
    --brass:#A9853C;
    --brass-soft:#D8C48F;
    --green:#2F6B4F;
    --green-bg:#DCEBE0;
    --rust:#A24632;
    --rust-bg:#F3DFD8;
    --card:#F4F7EF;
    --shadow: 0 2px 10px rgba(32,48,31,0.08);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* faint ledger ruling behind the whole app */
  .ledger-bg{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 37px,
      var(--line) 37px,
      var(--line) 38px
    );
    opacity:0.45;
  }
  #app{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto;
    min-height:100vh;
    padding-bottom:92px;
  }

  /* Header */
  header{
    padding:22px 20px 14px;
  }
  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:0.5px;
    color:var(--brass); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:"§"; font-size:14px;}
  h1{
    font-size:22px; font-weight:800; margin:4px 0 16px;
    letter-spacing:-0.3px;
  }
  .period-switch{
    display:flex; gap:8px; margin-bottom:18px;
  }
  .period-btn{
    flex:1; padding:9px 6px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink-soft); font-family:inherit;
    font-size:13px; font-weight:600; cursor:pointer; transition:all .15s;
  }
  .period-btn.active{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }

  .balance-card{
    background:var(--ink); color:var(--paper);
    border-radius:20px; padding:22px 20px; position:relative; overflow:hidden;
    box-shadow:var(--shadow);
  }
  .balance-card::after{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(234,241,228,0.06) 27px, rgba(234,241,228,0.06) 28px);
  }
  .balance-label{font-size:12px; color:var(--brass-soft); font-weight:600; position:relative;}
  .balance-amount{
    font-size:34px; font-weight:900; margin-top:6px; position:relative;
    font-variant-numeric: tabular-nums; direction:ltr; text-align:right;
    display:flex; align-items:baseline; gap:6px; justify-content:flex-end;
  }
  .balance-amount .unit{font-size:14px; font-weight:600; color:var(--brass-soft);}
  .balance-sub{
    display:flex; gap:18px; margin-top:16px; position:relative;
  }
  .balance-sub div{font-size:12px; color:#B9C4B2;}
  .balance-sub b{
    display:block; font-size:15px; font-weight:700; margin-top:2px;
    font-variant-numeric: tabular-nums; direction:ltr; text-align:right;
  }
  .balance-sub .in b{color:#8FCBA8;}
  .balance-sub .out b{color:#E39B85;}

  /* Sections */
  .section{padding:22px 20px 0;}
  .section-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px;
  }
  .section-title{font-size:15px; font-weight:800;}
  .section-link{font-size:12px; color:var(--brass); font-weight:600; cursor:pointer; background:none; border:none; font-family:inherit;}

  /* Budget cards */
  .budget-card{
    background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line);
  }
  .budget-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .budget-cat{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .cat-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .budget-nums{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; direction:ltr;}
  .budget-bar-track{height:7px; background:var(--paper-2); border-radius:99px; overflow:hidden;}
  .budget-bar-fill{height:100%; border-radius:99px; transition:width .4s ease;}
  .empty-hint{
    font-size:12.5px; color:var(--ink-soft); background:var(--card);
    border:1px dashed var(--line); border-radius:14px; padding:16px; text-align:center;
  }

  /* Transactions list, ledger style */
  .day-group{margin-bottom:18px;}
  .day-label{
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
    margin-bottom:6px; display:flex; align-items:center; gap:8px;
  }
  .day-label::after{content:""; flex:1; height:1px; background:var(--line);}
  .txn{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 13px; margin-bottom:8px;
  }
  .txn-icon{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .txn-mid{flex:1; min-width:0;}
  .txn-cat{font-size:13.5px; font-weight:700;}
  .txn-note{font-size:11.5px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn-amt{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; flex-shrink:0;}
  .txn-amt.in{color:var(--green);}
  .txn-amt.out{color:var(--rust);}
  .txn-del{
    background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer;
    padding:4px 2px; opacity:0.5;
  }

  /* Bottom nav */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    max-width:480px; margin:0 auto;
    background:rgba(234,241,228,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; color:var(--ink-soft); cursor:pointer;
  }
  .nav-btn.active{color:var(--ink);}
  .nav-btn .ic{font-size:19px;}
  .nav-btn .lb{font-size:10.5px; font-weight:700;}
  .fab{
    width:52px; height:52px; border-radius:50%;
    background:var(--brass); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:400; border:none; cursor:pointer;
    margin-top:-30px; box-shadow:0 4px 14px rgba(169,133,60,0.5);
    flex-shrink:0;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(32,48,31,0.45); z-index:10;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.active{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 16px;}
  .sheet-title{font-size:17px; font-weight:800; margin-bottom:16px;}
  .type-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .type-btn{
    flex:1; padding:12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); font-family:inherit; font-weight:700; font-size:14px;
    cursor:pointer; color:var(--ink-soft);
  }
  .type-btn.on.expense{background:var(--rust-bg); border-color:var(--rust); color:var(--rust);}
  .type-btn.on.income{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  label{font-size:12px; font-weight:700; color:var(--ink-soft); display:block; margin:14px 0 6px;}
  input[type=number], input[type=text], input[type=date], select{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); font-family:inherit; font-size:15px; color:var(--ink);
  }
  input[type=number]{direction:ltr; text-align:right; font-variant-numeric:tabular-nums;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:8px 14px; border-radius:99px; border:1.5px solid var(--line);
    background:var(--card); font-family:inherit; font-size:13px; cursor:pointer; color:var(--ink-soft);
  }
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .primary-btn{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:var(--ink); color:var(--paper); font-family:inherit;
    font-size:15px; font-weight:800; margin-top:20px; cursor:pointer;
  }
  .primary-btn:active{opacity:0.85;}

  ::selection{background:var(--brass-soft);}
</style>
</head>
<body>
<div class="ledger-bg"></div>
<div id="app">

  <header>
    <div class="eyebrow">دفتر حساب شخصی</div>
    <h1>مدیریت مالی</h1>
    <div class="period-switch">
      <button class="period-btn active" data-period="month">این ماه</button>
      <button class="period-btn" data-period="lastmonth">ماه قبل</button>
      <button class="period-btn" data-period="all">همه</button>
    </div>
    <div class="balance-card">
      <div class="balance-label">مانده حساب</div>
      <div class="balance-amount"><span id="balanceVal">۰</span><span class="unit">تومان</span></div>
      <div class="balance-sub">
        <div class="in">درآمد<b id="incVal">۰</b></div>
        <div class="out">هزینه<b id="expVal">۰</b></div>
      </div>
    </div>
  </header>

  <!-- OVERVIEW VIEW -->
  <div class="view active" id="view-home">
    <div class="section">
      <div class="section-head">
        <div class="section-title">بودجه ماه</div>
        <button class="section-link" onclick="switchView('budget')">مدیریت بودجه ›</button>
      </div>
      <div id="budgetSummary"></div>
    </div>
    <div class="section">
      <div class="section-head">
        <div class="section-title">آخرین تراکنش‌ها</div>
        <button class="section-link" onclick="switchView('txns')">همه ›</button>
      </div>
      <div id="recentTxns"></div>
    </div>
  </div>

  <!-- TRANSACTIONS VIEW -->
  <div class="view" id="view-txns">
    <div class="section">
      <div class="section-head"><div class="section-title">همه تراکنش‌ها</div></div>
      <div id="allTxns"></div>
    </div>
  </div>

  <!-- BUDGET VIEW -->
  <div class="view" id="view-budget">
    <div class="section">
      <div class="section-head"><div class="section-title">بودجه‌بندی ماهانه</div></div>
      <div id="budgetEditor"></div>
    </div>
  </div>

</div>

<nav>
  <button class="nav-btn active" data-view="home" onclick="switchView('home')">
    <span class="ic">⌂</span><span class="lb">خانه</span>
  </button>
  <button class="nav-btn" data-view="txns" onclick="switchView('txns')">
    <span class="ic">≡</span><span class="lb">تراکنش‌ها</span>
  </button>
  <button class="fab" onclick="openSheet()">+</button>
  <button class="nav-btn" data-view="budget" onclick="switchView('budget')">
    <span class="ic">◔</span><span class="lb">بودجه</span>
  </button>
  <button class="nav-btn" data-view="settings" onclick="resetConfirm()">
    <span class="ic">⟲</span><span class="lb">بازنشانی</span>
  </button>
</nav>

<!-- ADD TRANSACTION SHEET -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">ثبت تراکنش جدید</div>
    <div class="type-toggle">
      <button class="type-btn on expense" id="btnExpense" onclick="setType('expense')">هزینه</button>
      <button class="type-btn income" id="btnIncome" onclick="setType('income')">درآمد</button>
    </div>
    <label>مبلغ (تومان)</label>
    <input type="number" id="inpAmount" placeholder="۰" inputmode="numeric">
    <label>دسته‌بندی</label>
    <div class="chip-row" id="catChips"></div>
    <label>توضیح (اختیاری)</label>
    <input type="text" id="inpNote" placeholder="مثلاً: خرید هفتگی">
    <label>تاریخ</label>
    <input type="date" id="inpDate">
    <button class="primary-btn" onclick="saveTxn()">ثبت تراکنش</button>
  </div>
</div>

<script>
// ---------- Data ----------
const EXP_CATS = [
  {id:'food', name:'خوراک', color:'#A24632'},
  {id:'transport', name:'حمل‌ونقل', color:'#B0752C'},
  {id:'shopping', name:'خرید', color:'#8A5FA8'},
  {id:'bills', name:'قبوض', color:'#3E6E9E'},
  {id:'fun', name:'سرگرمی', color:'#C77DA0'},
  {id:'health', name:'سلامت', color:'#4E8B6C'},
  {id:'other_e', name:'سایر', color:'#6B6B6B'},
];
const INC_CATS = [
  {id:'salary', name:'حقوق', color:'#2F6B4F'},
  {id:'freelance', name:'فریلنس', color:'#3E8E6B'},
  {id:'gift', name:'هدیه', color:'#A9853C'},
  {id:'other_i', name:'سایر', color:'#6B6B6B'},
];
const ALL_CATS = [...EXP_CATS, ...INC_CATS];
function catById(id){ return ALL_CATS.find(c=>c.id===id) || {name:id, color:'#888'}; }

let data = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem('ledger_data_v1');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { txns: [], budgets: {} };
}
function saveData(){
  localStorage.setItem('ledger_data_v1', JSON.stringify(data));
}

// ---------- Helpers ----------
function fmt(n){
  n = Math.round(n);
  return n.toLocaleString('en-US');
}
function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function currentMonthKey(offset=0){
  const d = new Date();
  d.setMonth(d.getMonth()+offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthKeyOf(dateStr){
  return dateStr.slice(0,7);
}
const faWeekday = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const faMonths = ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
function fmtDayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return faWeekday[d.getDay()] + ' — ' + d.getDate() + ' ' + faMonths[d.getMonth()];
}

let currentPeriod = 'month';
function filteredTxns(){
  if(currentPeriod === 'all') return [...data.txns].sort((a,b)=>b.date.localeCompare(a.date));
  const key = currentPeriod === 'month' ? currentMonthKey(0) : currentMonthKey(-1);
  return data.txns.filter(t=>monthKeyOf(t.date)===key).sort((a,b)=>b.date.localeCompare(a.date));
}

// ---------- Render: Header balance ----------
function renderHeader(){
  const txns = filteredTxns();
  let inc=0, exp=0;
  txns.forEach(t=> t.type==='income' ? inc+=t.amount : exp+=t.amount);
  document.getElementById('balanceVal').textContent = fmt(inc-exp);
  document.getElementById('incVal').textContent = fmt(inc);
  document.getElementById('expVal').textContent = fmt(exp);
}

// ---------- Render: Budget summary (home) ----------
function renderBudgetSummary(){
  const key = currentMonthKey(0);
  const budgets = data.budgets[key] || {};
  const catIds = Object.keys(budgets).filter(id=>budgets[id] > 0);
  const container = document.getElementById('budgetSummary');
  if(catIds.length === 0){
    container.innerHTML = `<div class="empty-hint">هنوز بودجه‌ای تنظیم نکردی. برای شروع به بخش «بودجه» برو.</div>`;
    return;
  }
  const monthTxns = data.txns.filter(t=>monthKeyOf(t.date)===key && t.type==='expense');
  container.innerHTML = catIds.map(id=>{
    const cat = catById(id);
    const spent = monthTxns.filter(t=>t.category===id).reduce((s,t)=>s+t.amount,0);
    const budget = budgets[id];
    const pct = Math.min(100, Math.round(spent/budget*100));
    const over = spent > budget;
    return `<div class="budget-card">
      <div class="budget-top">
        <div class="budget-cat"><span class="cat-dot" style="background:${cat.color}"></span>${cat.name}</div>
        <div class="budget-nums">${fmt(spent)} / ${fmt(budget)}</div>
      </div>
      <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${pct}%; background:${over?'#A24632':cat.color}"></div></div>
    </div>`;
  }).join('');
}

// ---------- Render: Recent txns (home, max 5) ----------
function txnRow(t){
  const cat = catById(t.category);
  const isIn = t.type === 'income';
  return `<div class="txn">
    <div class="txn-icon" style="background:${cat.color}22; color:${cat.color}">${isIn?'↓':'↑'}</div>
    <div class="txn-mid">
      <div class="txn-cat">${cat.name}</div>
      ${t.note ? `<div class="txn-note">${escapeHtml(t.note)}</div>` : ''}
    </div>
    <div class="txn-amt ${isIn?'in':'out'}">${isIn?'+':'−'}${fmt(t.amount)}</div>
    <button class="txn-del" onclick="deleteTxn('${t.id}')">✕</button>
  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderRecent(){
  const txns = filteredTxns().slice(0,5);
  const container = document.getElementById('recentTxns');
  if(txns.length===0){
    container.innerHTML = `<div class="empty-hint">هنوز تراکنشی ثبت نشده. با دکمه + شروع کن.</div>`;
    return;
  }
  container.innerHTML = txns.map(txnRow).join('');
}

// ---------- Render: All txns grouped by day ----------
function renderAllTxns(){
  const txns = filteredTxns();
  const container = document.getElementById('allTxns');
  if(txns.length===0){
    container.innerHTML = `<div class="empty-hint">هنوز تراکنشی ثبت نشده.</div>`;
    return;
  }
  const groups = {};
  txns.forEach(t=>{
    if(!groups[t.date]) groups[t.date] = [];
    groups[t.date].push(t);
  });
  const dates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  container.innerHTML = dates.map(date=>{
    return `<div class="day-group">
      <div class="day-label">${fmtDayLabel(date)}</div>
      ${groups[date].map(txnRow).join('')}
    </div>`;
  }).join('');
}

// ---------- Render: Budget editor ----------
function renderBudgetEditor(){
  const key = currentMonthKey(0);
  if(!data.budgets[key]) data.budgets[key] = {};
  const budgets = data.budgets[key];
  const container = document.getElementById('budgetEditor');
  container.innerHTML = EXP_CATS.map(cat=>{
    const val = budgets[cat.id] || '';
    return `<div class="budget-card">
      <div class="budget-top">
        <div class="budget-cat"><span class="cat-dot" style="background:${cat.color}"></span>${cat.name}</div>
      </div>
      <input type="number" inputmode="numeric" placeholder="بدون سقف" value="${val}"
        style="margin-top:2px" onchange="setBudget('${cat.id}', this.value)">
    </div>`;
  }).join('');
}
function setBudget(catId, val){
  const key = currentMonthKey(0);
  if(!data.budgets[key]) data.budgets[key] = {};
  data.budgets[key][catId] = Number(val) || 0;
  saveData();
  renderAll();
}

// ---------- Delete ----------
function deleteTxn(id){
  data.txns = data.txns.filter(t=>t.id!==id);
  saveData();
  renderAll();
}

// ---------- View switching ----------
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector(`.nav-btn[data-view="${name}"]`);
  if(btn) btn.classList.add('active');
}

// ---------- Period switching ----------
document.querySelectorAll('.period-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderAll();
  });
});

// ---------- Add transaction sheet ----------
let currentType = 'expense';
let selectedCat = null;

function openSheet(){
  document.getElementById('overlay').classList.add('active');
  document.getElementById('inpDate').value = todayStr();
  setType('expense');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('inpAmount').value = '';
  document.getElementById('inpNote').value = '';
  selectedCat = null;
}
function setType(type){
  currentType = type;
  document.getElementById('btnExpense').classList.toggle('on', type==='expense');
  document.getElementById('btnIncome').classList.toggle('on', type==='income');
  const cats = type==='expense' ? EXP_CATS : INC_CATS;
  selectedCat = cats[0].id;
  const chips = document.getElementById('catChips');
  chips.innerHTML = cats.map(c=>`<button class="chip ${c.id===selectedCat?'on':''}" data-cat="${c.id}" onclick="pickCat('${c.id}')">${c.name}</button>`).join('');
}
function pickCat(id){
  selectedCat = id;
  document.querySelectorAll('#catChips .chip').forEach(c=>{
    c.classList.toggle('on', c.dataset.cat === id);
  });
}
function saveTxn(){
  const amount = Number(document.getElementById('inpAmount').value);
  if(!amount || amount <= 0){
    document.getElementById('inpAmount').focus();
    return;
  }
  const date = document.getElementById('inpDate').value || todayStr();
  const note = document.getElementById('inpNote').value.trim();
  data.txns.push({
    id: 'id'+Date.now()+Math.random().toString(36).slice(2,7),
    type: currentType,
    category: selectedCat,
    amount, date, note
  });
  saveData();
  closeSheet();
  renderAll();
}

function resetConfirm(){
  if(confirm('همه اطلاعات مالی ثبت‌شده پاک بشه؟ این کار قابل بازگشت نیست.')){
    data = { txns: [], budgets: {} };
    saveData();
    renderAll();
  }
}

// ---------- Master render ----------
function renderAll(){
  renderHeader();
  renderBudgetSummary();
  renderRecent();
  renderAllTxns();
  renderBudgetEditor();
}
renderAll();
</script>
</body>
</html>
